[project]
name = "gcpapi-sync"
version = "0.1.20261022"
description = "Typed sync and async Python client for the Garmin Connect Personal API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Camminady", email = "thomas@camminady.dev" }]
requires-python = ">=3.11"
keywords = [
    "garmin",
    "garmin-connect",
    "garmin-api",
    "personal-api",
    "api-client",
    "fitness",
    "health-data",
    "fit-files",
    "sleep",
    "hrv",
    "running",
    "cycling",
    "pydantic",
    "httpx",
    "asyncio",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.4",
    "fire>=0.7",
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12; python_version < '3.12'",
]

[project.scripts]
gcpapi = "gcpapi_sync.cli:main"

[project.urls]
Homepage = "https://github.com/thomascamminady/gcpapi-sync"
Documentation = "https://camminady.dev/gcpapi-sync/"
Repository = "https://github.com/thomascamminady/gcpapi-sync"
Issues = "https://github.com/thomascamminady/gcpapi-sync/issues"
Changelog = "https://github.com/thomascamminady/gcpapi-sync/blob/main/CHANGELOG.md"
"Garmin API docs" = "https://developer.garmin.com/gc-developer-program/personal/swagger-docs/"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.15",
    "ty>=0.0.90",
]
docs = ["pdoc>=15"]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # the repository LICENSE covers every file
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "D105",    # magic-method docstrings
    "D107",    # __init__ is documented on the class
    "EM101",   # literal exception messages are fine
    "EM102",
    "TRY003",  # descriptive exception messages
    "PLR0913", # API methods mirror the endpoint's query parameters
    "PLR2004", # HTTP status codes read better inline
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is how pytest works
    "D",       # test names document themselves
    "PLR2004",
    "SLF001",  # tests may poke at internals
    "S105",    # fake tokens
    "S106",
    "FBT001",  # parametrized booleans
    "PLC0415", # local imports in tests
    "INP001",  # tests/ is not a package
]
"scripts/**" = [
    "T201",    # command line scripts report progress with print()
    "S310",    # urlopen() is only called with fixed https:// URLs
    "S603",    # subprocess runs ruff with an argument list, never a shell
    "INP001",  # scripts/ holds standalone uv scripts, not a package
]
"src/gcpapi_sync/models/_generated.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# pydantic resolves annotations at runtime, so their imports must stay runtime imports.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "gcpapi_sync.models._base.GarminModel"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
    "deprecated",
]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["fire", "fire.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# As strict as ty gets: every rule, including those off by default, is an error.
all = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: hits the real Garmin API; needs GARMIN_PERSONAL_API_KEY (run with -m live)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["gcpapi_sync"]
branch = true
# Version-dependent imports; each branch only runs on some interpreters.
omit = ["*/gcpapi_sync/_compat.py", "*/gcpapi_sync/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 99
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]

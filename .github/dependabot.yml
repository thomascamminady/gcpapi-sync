version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only adopt releases that have been public for two weeks.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      development:
        dependency-type: development
      runtime:
        dependency-type: production

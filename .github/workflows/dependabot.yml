name: Dependabot

# Dependabot's pull requests merge themselves once every required check passes; a failing
# check keeps one open for a person.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Merge once the checks pass
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

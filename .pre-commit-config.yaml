# Install once with: uv run pre-commit install
# The same hooks run in CI (`uv run pre-commit run --all-files`).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: no-api-key-files
        name: never commit Garmin API keys
        language: fail
        entry: "API key files must not be committed; keep the key in ~/.config/garmin/"
        files: '(^|/)(\.apikey|.*\.apikey|connect-personal-api-key|\.env)$'

      - id: no-suppression-comments
        name: no noqa / type-ignore / ty-ignore comments
        language: pygrep
        entry: '#\s*(noqa|type:\s*ignore|ty:\s*ignore|pyright:\s*ignore|pragma:\s*no\s*cover)'
        types: [python]

      - id: uv-lock
        name: uv.lock is up to date
        language: system
        entry: uv lock --check
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen ruff format
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        types_or: [python, pyi]

      - id: ty
        name: ty (all rules as errors)
        language: system
        entry: uv run --frozen ty check
        types_or: [python, pyi]
        pass_filenames: false

      - id: mypy
        name: mypy --strict
        language: system
        entry: uv run --frozen mypy
        types_or: [python, pyi]
        pass_filenames: false

      - id: pytest
        name: pytest
        language: system
        entry: uv run --frozen pytest -q
        pass_filenames: false
        always_run: true
        stages: [pre-push]
